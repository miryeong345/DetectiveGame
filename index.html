<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI 탐정 수사본부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: a detective's desk; each screen is one manila case file laid on it, one case at a time. Single deliberate look in both themes. */
:root{
  --desk:#1d2a2f; --desk-2:#26363c;
  --paper:#f4ead3; --paper-2:#e9dcbc; --line:#cdbb93;
  --ink:#2a241c; --ink-soft:#6b5f4c;
  --brass:#c99a2e; --brass-ink:#3a2a05;
  --stamp:#b3322a; --ok:#2f7a45; --maybe:#b07a12; --clue:#2f5b86;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-type:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  color-scheme:light;
}
html,body{background:var(--desk);color:var(--paper)}
body{
  font-family:var(--f-body);font-size:18px;line-height:1.6;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(201,154,46,.16),transparent 55%),
    repeating-linear-gradient(90deg,var(--desk) 0 38px,var(--desk-2) 38px 40px);
  min-height:100%;
}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;letter-spacing:.02em;color:var(--paper)}
.brand svg{flex:none}
.tag{font-family:var(--f-type);font-size:13px;letter-spacing:.12em;color:var(--brass);text-transform:uppercase}

/* the case file */
.file{position:relative;background:var(--paper);color:var(--ink);border-radius:4px 14px 6px 6px;
  box-shadow:0 18px 40px rgba(0,0,0,.45),0 2px 0 var(--paper-2) inset;padding:30px 26px 28px;}
.file::before{content:attr(data-tab);position:absolute;top:-30px;left:22px;background:var(--paper);color:var(--ink-soft);
  font-family:var(--f-type);font-size:13px;letter-spacing:.1em;padding:6px 16px 8px;border-radius:10px 10px 0 0}
.file h1,.file h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
.file h1{font-size:clamp(34px,7vw,52px)}
.file h2{font-size:clamp(26px,5.4vw,36px)}
.lead{margin:0;font-size:19px;color:var(--ink-soft);max-width:60ch}
.stack{display:flex;flex-direction:column;gap:18px}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;background:var(--paper-2);border-radius:10px;padding:12px 14px}
.steps b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.steps span{color:var(--ink-soft);font-size:16px}
.num{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:22px}

label.big{font-family:var(--f-display);font-size:20px;display:block;margin-bottom:6px}
input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;font-size:20px;color:var(--ink);background:#fffaf0;
  border:2px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:4px solid var(--brass);outline-offset:3px}

.btn{font-family:var(--f-display);font-size:22px;border:0;border-radius:12px;padding:14px 26px;cursor:pointer;
  background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
  box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.brass{background:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* progress */
.progress{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:17px;color:var(--paper)}
.dot.now{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.dot.done{background:var(--paper);color:var(--desk)}

/* case parts */
.casehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kind{font-family:var(--f-type);font-size:13px;letter-spacing:.08em;border:2px dashed var(--ink-soft);color:var(--ink-soft);padding:4px 10px;border-radius:6px}
.question{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.question h2{flex:1 1 300px;min-width:0}
.speak{font-family:var(--f-body);font-size:16px;padding:8px 14px}
.part{border-top:2px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.part-title{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:21px}
.part-title .num{width:34px;height:34px;font-size:17px;border-width:2px}
.ai-card{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;background:#fffaf0;border:2px solid var(--line);border-radius:12px;padding:14px}
.ai-face{width:52px;height:52px;border-radius:12px;background:var(--desk);display:grid;place-items:center}
.ai-text{font-family:var(--f-type);font-size:19px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.ai-text small{display:block;font-family:var(--f-body);font-size:14px;color:var(--ink-soft);margin-top:4px}
.linkish{background:none;border:0;padding:0;font:inherit;font-size:15px;color:var(--clue);text-decoration:underline;cursor:pointer;align-self:flex-start}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search a{font-family:var(--f-display);font-size:19px;text-decoration:none;border-radius:10px;padding:10px 18px;color:#fff;display:inline-flex;align-items:center;gap:8px}
.search .g{background:#3b6fd8}.search .n{background:#169d4a}

.verdicts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vbtn{font-family:var(--f-display);font-size:19px;line-height:1.3;border-radius:12px;padding:14px 8px;cursor:pointer;background:#fffaf0;border:3px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.vbtn .mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px}
.vbtn[data-v=right] .mark{background:var(--ok)}
.vbtn[data-v=wrong] .mark{background:var(--stamp)}
.vbtn[data-v=none] .mark{background:var(--maybe)}
.vbtn[aria-pressed=true]{border-color:var(--ink);background:var(--paper-2);box-shadow:inset 0 0 0 2px var(--ink)}
@media (max-width:520px){.verdicts{grid-template-columns:1fr}.vbtn{flex-direction:row;justify-content:flex-start;padding:12px 14px}}

/* clue reveal */
.clue{background:#e7eef6;border:2px solid var(--clue);border-radius:12px;padding:16px 18px;color:#1d2f44;display:flex;flex-direction:column;gap:8px}
.clue-head{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;color:var(--clue)}
.clue p{margin:0}
.verdict-line{font-family:var(--f-display);font-size:20px}
.verdict-line.good{color:var(--ok)} .verdict-line.bad{color:var(--stamp)} .verdict-line.free{color:var(--clue)}

/* result */
.score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.score div{background:var(--paper-2);border-radius:12px;padding:14px 16px}
.score b{font-family:var(--f-display);font-weight:400;font-size:40px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.score span{font-size:16px;color:var(--ink-soft)}
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:10px;background:#fffaf0}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:16px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-type);font-size:13px;letter-spacing:.06em;color:var(--ink-soft);background:var(--paper-2)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;color:#fff;white-space:nowrap}
.pill.right{background:var(--ok)}.pill.wrong{background:var(--stamp)}.pill.none{background:var(--maybe)}.pill.blank{background:var(--ink-soft)}
.lesson{position:relative;text-align:center;padding:26px 14px;border:4px double var(--stamp);border-radius:14px;color:var(--stamp)}
.lesson .s{font-family:var(--f-type);font-size:14px;letter-spacing:.2em}
.lesson p{font-family:var(--f-display);font-size:clamp(24px,5.4vw,34px);line-height:1.35;margin:6px 0 0;text-wrap:balance}
.stampin{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(1.6) rotate(-6deg)}to{transform:scale(1) rotate(-2deg)}}
.note{font-size:15px;color:var(--ink-soft);margin:0}
.toast{font-size:16px;color:var(--ok);min-height:1.4em;margin:0}
.toast.err{color:var(--stamp)}
/* cover */
.cover{padding:0;border-radius:4px 14px 10px 10px}
.scene{display:block;width:100%;height:auto;background:#121d22;border-radius:4px 14px 0 0}
.cover-body{padding:22px 26px 28px;display:flex;flex-direction:column;gap:14px}
.case-no{font-family:var(--f-type);font-size:14px;letter-spacing:.1em;color:var(--stamp);font-weight:700}
.cover h1{font-size:clamp(36px,8vw,58px)}
.cover .btn{font-size:26px;padding:16px 34px}
.tape{animation:tapein .7s cubic-bezier(.2,1.4,.4,1) both}
.tape.t2{animation-delay:.15s}
@keyframes tapein{from{transform:translateX(-120px);opacity:0}to{transform:none;opacity:1}}
.beam{animation:flicker 4s infinite}
@keyframes flicker{0%,100%{opacity:.9}46%{opacity:.9}48%{opacity:.55}50%{opacity:.95}53%{opacity:.7}56%{opacity:.9}}
.lensarm{transform-origin:226px 352px;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.bob.d1{animation-delay:.6s}.bob.d2{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blink{animation:blink 3.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.tape,.beam,.lensarm,.bob,.blink{animation:none}}
@media (prefers-reduced-motion:reduce){.stampin{animation:none;transform:rotate(-2deg)}.btn{transition:none}}
@media (max-width:480px){.file{padding:26px 18px 22px}.steps li{grid-template-columns:40px 1fr}.num{width:40px;height:40px}}
</style>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="14" cy="14" r="10" fill="none" stroke="#c99a2e" stroke-width="4"/><path d="M21.5 21.5 31 31" stroke="#c99a2e" stroke-width="5" stroke-linecap="round"/></svg>
      AI 탐정 수사본부
    </div>
    <div class="progress" id="progress" aria-label="사건 진행"></div>
  </header>

  <main id="app"></main>
</div>

<script>
const CASES = [
  { kind:"보통 질문", q:"대한민국의 수도는 어디인가요?", search:"대한민국 수도",
    fact:"정답은 서울이에요.",
    tip:"AI의 답이 '서울'이었나요? 맞았더라도, 맞았다는 걸 알 수 있었던 건 우리가 직접 확인했기 때문이에요." },
  { kind:"AI가 모르는 질문", q:"우리 학교 교장선생님 이름은 무엇인가요?", search:"우리 학교 교장선생님",
    fact:"학교 홈페이지를 보거나 선생님께 여쭤봐야 알 수 있어요.",
    tip:"AI는 우리 학교를 잘 몰라요. AI가 이름을 말했다면, 진짜 이름과 같은지 꼭 비교해 보세요. 모르는 것을 그럴듯하게 지어내는 것이 AI의 큰 실수예요." },
  { kind:"보통 질문", q:"BTS 멤버는 모두 몇 명인가요?", search:"BTS 멤버 수",
    fact:"정답은 7명이에요. (RM, 진, 슈가, 제이홉, 지민, 뷔, 정국)",
    tip:"숫자가 7명이었나요? 멤버 이름까지 말했다면 이름도 하나씩 맞는지 확인해 보세요." },
  { kind:"정답이 없는 질문", q:"세상에서 가장 맛있는 음식은 무엇인가요?", search:"세상에서 가장 맛있는 음식",
    fact:"정답은 없어요. 좋아하는 음식은 사람마다 달라요.",
    tip:"AI가 음식 하나를 정답처럼 골랐나요? 아니면 '사람마다 달라요'라고 했나요? 정답이 없는 질문에 정답이 있는 것처럼 말하면 조심해야 해요." },
  { kind:"엉뚱한 질문", q:"하늘을 나는 펭귄은 어디에 살고 있나요?", search:"펭귄은 날 수 있나요",
    fact:"펭귄은 하늘을 날 수 없어요. 대신 물속에서 아주 빠르게 헤엄쳐요.",
    tip:"AI가 '펭귄은 날 수 없어요'라고 알려 주었나요? 아니면 질문에 맞춰 이야기를 지어냈나요?" },
  { kind:"AI가 헷갈리는 질문", q:"오늘은 몇 월 며칠인가요?", search:"오늘 날짜",
    fact:"달력이나 컴퓨터 화면 아래쪽 시계를 보면 오늘 날짜를 알 수 있어요.",
    tip:"AI가 말한 날짜가 달력과 같았나요? AI는 오늘이 며칠인지 모를 때가 많아요." }
];
const V = {
  right:{label:"AI 말이 맞아요", mark:"O"},
  wrong:{label:"AI가 틀렸어요", mark:"X"},
  none:{label:"정답이 없는 질문이에요", mark:"?"}
};

const blankRows = () => CASES.map(()=>({ ai:"", mine:"", verdict:null, revealed:false }));
const state = { name:"", idx:-1, rows: blankRows() };
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

const AI_FACE = `<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="5" y="9" width="24" height="18" rx="5" fill="#f4ead3"/><circle cx="13" cy="18" r="2.6" fill="#1d2a2f"/><circle cx="21" cy="18" r="2.6" fill="#1d2a2f"/><path d="M17 9V4" stroke="#c99a2e" stroke-width="2.5" stroke-linecap="round"/><circle cx="17" cy="3.5" r="2.2" fill="#c99a2e"/></svg>`;
const LENS = `<svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="4"/><path d="M21 21 30 30" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>`;

function speak(text){
  try{ if(!("speechSynthesis" in window)) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=.9; speechSynthesis.speak(u);}catch(e){}
}
const canSpeak = (()=>{ try{ return "speechSynthesis" in window }catch(e){ return false } })();

function renderProgress(){
  const p = document.getElementById("progress");
  if(state.idx<0){ p.innerHTML = `<span class="tag">탐정 훈련 프로그램</span>`; return; }
  p.innerHTML = CASES.map((c,i)=>{
    const cls = i===state.idx ? "now" : (state.rows[i].revealed ? "done" : "");
    return `<span class="dot ${cls}" aria-label="사건 ${i+1}">${i+1}</span>`;
  }).join("");
}

function renderCover(){
  app.innerHTML = `
  <section class="file cover" data-tab="1급 비밀 · 사건 접수">
    <svg class="scene" viewBox="0 0 800 480" role="img" aria-label="밤의 사건 현장. 탐정이 돋보기로 수상한 AI 컴퓨터를 살펴보고 있어요. 바닥에는 발자국과 증거 표지판이 있고, 노란 출입 금지 테이프가 쳐져 있어요.">
      <defs>
        <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".75"/><stop offset="1" stop-color="#ffe9a8" stop-opacity=".05"/></linearGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7fe0c8" stop-opacity=".55"/><stop offset="1" stop-color="#7fe0c8" stop-opacity="0"/></radialGradient>
        <clipPath id="lensClip"><circle cx="350" cy="296" r="27"/></clipPath>
      </defs>
      <style>.scene text{font-family:"Black Han Sans","Malgun Gothic",sans-serif}</style>
      <!-- room -->
      <rect width="800" height="480" fill="#142228"/>
      <g stroke="#1b2e35" stroke-width="2">${Array.from({length:9},(_,k)=>`<line x1="0" y1="${40+k*36}" x2="800" y2="${40+k*36}"/>`).join("")}</g>
      <rect y="350" width="800" height="130" fill="#203039"/>
      <g stroke="#2a3d47" stroke-width="2">${[-300,-150,0,150,300,450,600,750,900,1050].map(x=>`<line x1="${400+(x-400)*.35}" y1="350" x2="${x}" y2="480"/>`).join("")}</g>
      <!-- window with moon -->
      <rect x="590" y="40" width="150" height="110" fill="#0d171b" stroke="#3a4d55" stroke-width="6"/>
      <line x1="665" y1="40" x2="665" y2="150" stroke="#3a4d55" stroke-width="5"/>
      <circle cx="700" cy="78" r="18" fill="#f4ead3" opacity=".85"/><circle cx="708" cy="72" r="16" fill="#0d171b"/>
      <!-- lamp & beam -->
      <line x1="480" y1="0" x2="480" y2="44" stroke="#3a4d55" stroke-width="3"/>
      <polygon class="beam" points="455,62 505,62 680,470 280,470" fill="url(#beamG)"/>
      <path d="M452 64 L466 42 H494 L508 64 Z" fill="#c99a2e"/>
      <!-- desk & AI computer -->
      <ellipse cx="480" cy="235" rx="140" ry="90" fill="url(#glow)"/>
      <rect x="360" y="304" width="240" height="16" rx="3" fill="#6b4626"/>
      <rect x="378" y="320" width="12" height="60" fill="#55381e"/><rect x="570" y="320" width="12" height="60" fill="#55381e"/>
      <rect x="468" y="284" width="24" height="22" fill="#33474f"/>
      <rect x="400" y="180" width="160" height="108" rx="12" fill="#2b3e46" stroke="#f4ead3" stroke-width="4"/>
      <rect x="414" y="193" width="132" height="82" rx="6" fill="#8fdcc6"/>
      <g fill="#142228"><rect class="blink" x="446" y="216" width="14" height="22" rx="6"/><rect class="blink" x="500" y="216" width="14" height="22" rx="6"/></g>
      <path d="M452 256 Q480 246 508 258" stroke="#142228" stroke-width="5" fill="none" stroke-linecap="round"/>
      <line x1="480" y1="180" x2="480" y2="160" stroke="#f4ead3" stroke-width="4"/><circle cx="480" cy="155" r="7" fill="#b3322a"/>
      <!-- suspicious speech bubbles -->
      <g class="bob"><rect x="236" y="96" width="150" height="54" rx="14" fill="#f4ead3"/><path d="M360 148 L392 178 L344 150 Z" fill="#f4ead3"/>
        <text x="311" y="131" font-size="22" text-anchor="middle" fill="#2a241c">BTS는 6명!</text></g>
      <g class="bob d1"><rect x="572" y="178" width="178" height="54" rx="14" fill="#f4ead3"/><path d="M590 196 L560 214 L596 216 Z" fill="#f4ead3"/>

function renderIntro(){
  app.innerHTML = `
  <section class="file stack" data-tab="극비 · 탐정 훈련">
    <h1>AI의 실수를 찾아라!</h1>
    <p class="lead">AI는 똑똑하지만 가끔 틀린 말을 해요. 오늘 여러분은 탐정이 되어 AI의 답을 직접 확인해 볼 거예요.</p>
    <ol class="steps">
      <li><span class="num">1</span><div><b>AI에게 물어봐요</b><span>질문을 AI에게 물어보고, AI의 답을 칸에 적어요.</span></div></li>
      <li><span class="num">2</span><div><b>직접 찾아봐요</b><span>구글이나 네이버에서 검색해서 진짜 답을 찾아 적어요.</span></div></li>
      <li><span class="num">3</span><div><b>판정해요</b><span>두 답을 비교해서 AI가 맞았는지, 틀렸는지, 정답이 없는 질문인지 골라요.</span></div></li>
    </ol>
    <div>
      <label class="big" for="detective-name">탐정 이름</label>
      <input type="text" id="detective-name" placeholder="이름을 써 주세요" value="${esc(state.name)}" maxlength="20" autocomplete="off">
    </div>
    <div class="row end"><button class="btn brass" id="start">수사 시작하기</button></div>
  </section>`;
  const inp = document.getElementById("detective-name");
  document.getElementById("start").onclick = () => { state.name = inp.value.trim() || "이름 없는 탐정"; go(0); };
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("start").click(); });
}

async function copyQuestion(text, btn){
  const done = msg => { const o = btn.textContent; btn.textContent = msg; setTimeout(()=> btn.textContent = o, 1600); };
  try{ await navigator.clipboard.writeText(text); done("복사했어요!"); }
  catch(e){
    const h = document.getElementById("q-text");
    const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents(h); sel.removeAllRanges(); sel.addRange(rg);
    done("Ctrl+C를 눌러요");
  }
}

function renderCase(){
  const i = state.idx, c = CASES[i], r = state.rows[i];
  const g = "https://www.google.com/search?q="+encodeURIComponent(c.search);
  const n = "https://search.naver.com/search.naver?query="+encodeURIComponent(c.search);
  const ro = r.revealed ? "readonly" : "";
  app.innerHTML = `
  <section class="file stack" data-tab="사건 파일 No.${i+1}">
    <div class="casehead">
      <span class="tag" style="color:var(--ink-soft)">사건 ${i+1} / ${CASES.length}</span>
      <span class="kind">${esc(c.kind)}</span>
    </div>
    <div class="question">
      <h2 id="q-text">${esc(c.q)}</h2>
      <div class="row">
        <button class="btn ghost speak" id="copy-q">질문 복사</button>
        ${canSpeak?`<button class="btn ghost speak" id="read-q">소리로 듣기</button>`:""}
      </div>
    </div>

    <div class="part">
      <div class="part-title"><span class="num">1</span>AI의 답</div>
      <div class="ai-card">
        <div class="ai-face">${AI_FACE}</div>
        <div style="min-width:0">
          <label class="note" for="ai-answer">AI에게 이 질문을 물어보고, AI가 한 말을 그대로 적어요.</label>
          <textarea id="ai-answer" placeholder="예: AI는 ○○라고 했어요" ${ro}>${esc(r.ai)}</textarea>
        </div>
      </div>
    </div>

    <div class="part">
      <div class="part-title"><span class="num">2</span>내가 직접 찾은 답</div>
      <div class="search">
        <a class="g" href="${g}" target="_blank" rel="noopener">${LENS}구글에서 찾기</a>
        <a class="n" href="${n}" target="_blank" rel="noopener">${LENS}네이버에서 찾기</a>
      </div>
      <label class="note" for="mine">검색해서 찾은 답을 적어요.</label>
      <textarea id="mine" placeholder="예: 내가 찾은 답은 ○○예요" ${ro}>${esc(r.mine)}</textarea>
    </div>

    <div class="part">
      <div class="part-title"><span class="num">3</span>탐정 판정</div>
      <p class="note">두 답을 비교해 보고 골라요.</p>
      <div class="verdicts" role="group" aria-label="판정 고르기">
        ${Object.entries(V).map(([k,v])=>`<button class="vbtn" data-v="${k}" aria-pressed="${r.verdict===k}" ${r.revealed?"disabled":""}><span class="mark">${v.mark}</span>${v.label}</button>`).join("")}
      </div>
    </div>

    <div id="clue-slot">${r.revealed?clueHTML(i):""}</div>
    <p class="toast err" id="need" aria-live="polite"></p>

    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="prev">${i===0?"처음으로":"이전 사건"}</button>
      ${r.revealed
        ? `<button class="btn brass" id="next">${i===CASES.length-1?"수사 결과 보기":"다음 사건"}</button>`
        : `<button class="btn" id="reveal">단서 확인하기</button>`}
    </div>
  </section>`;

  const ai = document.getElementById("ai-answer"), mine = document.getElementById("mine");
  ai.addEventListener("input", ()=> r.ai = ai.value);
  mine.addEventListener("input", ()=> r.mine = mine.value);
  document.querySelectorAll(".vbtn").forEach(b=> b.onclick = ()=>{
    r.verdict = b.dataset.v;
    document.querySelectorAll(".vbtn").forEach(x=> x.setAttribute("aria-pressed", x===b));
  });
  document.getElementById("copy-q").onclick = e => copyQuestion(c.q, e.currentTarget);
  const rq = document.getElementById("read-q");
  if(rq) rq.onclick = ()=> speak(c.q);
  document.getElementById("prev").onclick = ()=> go(i-1);
  const rv = document.getElementById("reveal");
  if(rv) rv.onclick = ()=>{
    const need = document.getElementById("need");
    if(!r.ai.trim()){ need.textContent = "1번 칸에 AI의 답을 먼저 적어 주세요."; ai.focus(); return; }
    if(!r.mine.trim()){ need.textContent = "2번 칸에 내가 찾은 답을 먼저 적어 주세요."; mine.focus(); return; }
    if(!r.verdict){ need.textContent = "3번에서 판정을 하나 골라 주세요."; return; }
    r.revealed = true; renderCase(); renderProgress();
    document.getElementById("clue-slot").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth", block:"center"});
  };
  const nx = document.getElementById("next");
  if(nx) nx.onclick = ()=> go(i+1);
}

function clueHTML(i){
  const c = CASES[i], r = state.rows[i];
  return `<div class="clue" role="status">
    <div class="clue-head">${LENS}단서</div>
    <p class="verdict-line free">내 판정: ${V[r.verdict].label}</p>
    <p><b>진짜 답:</b> ${esc(c.fact)}</p>
    <p><b>탐정 팁:</b> ${esc(c.tip)}</p>
    <p class="note">판정이 헷갈리면 친구, 선생님과 함께 이야기해 봐요.</p>
  </div>`;
}

function stats(){
  const s = {right:0, wrong:0, none:0, blank:0};
  state.rows.forEach(r=> s[r.verdict || "blank"]++);
  return s;
}

function today(){
  const d = new Date();
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}

function renderResult(){
  const s = stats();
  const rows = CASES.map((c,i)=>{
    const r = state.rows[i];
    const v = r.verdict ? `<span class="pill ${r.verdict}">${V[r.verdict].label}</span>` : `<span class="pill blank">판정 안 함</span>`;
    return `<tr><td>${i+1}</td><td>${esc(c.q)}</td><td>${esc(r.ai)||"-"}</td><td>${esc(r.mine)||"-"}</td><td>${v}</td></tr>`;
  }).join("");
  app.innerHTML = `
  <section class="file stack" data-tab="수사 보고서">
    <div class="casehead"><span class="tag" style="color:var(--ink-soft)">${today()}</span><span class="kind">수사 완료</span></div>
    <h2>${esc(state.name)} 탐정의 수사 결과</h2>
    <div class="score">
      <div><b style="color:var(--stamp)">${s.wrong}개</b><span>찾아낸 AI의 실수</span></div>
      <div><b style="color:var(--ok)">${s.right}개</b><span>AI가 맞게 말한 답</span></div>
      <div><b style="color:var(--maybe)">${s.none}개</b><span>정답이 없는 질문</span></div>
      <div><b>${CASES.length - s.blank} / ${CASES.length}</b><span>수사한 사건</span></div>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>사건</th><th>질문</th><th>AI의 답</th><th>내가 찾은 답</th><th>내 판정</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="lesson stampin">
      <div class="s">오늘의 탐정 수칙</div>
      <p>AI 답을 그대로 믿지 말고<br>꼭 확인해야 한다!</p>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="restart">처음부터 다시</button>
      <button class="btn brass" id="dl">결과지 내려받기</button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
  </section>`;
  document.getElementById("restart").onclick = ()=>{ state.rows = blankRows(); go(-1); };
  document.getElementById("dl").onclick = download;
}

async function download(){
  const t = document.getElementById("toast");
  t.className = "toast"; t.textContent = "";
  let dl = null;
  try{ dl = await window.claude?.use?.("downloads"); }catch(e){ dl = null; }
  if(!dl){ t.className="toast err"; t.textContent = "이 화면에서는 내려받기를 할 수 없어요. 결과 화면을 캡처해서 저장해 주세요."; return; }
  const safe = state.name.replace(/[\\/:*?"<>|]/g,"").slice(0,20) || "탐정";
  try{
    await dl.save({ filename:`AI탐정_결과지_${safe}.html`, data: reportHTML() });
    t.textContent = "결과지를 저장했어요. 파일을 열어서 인쇄할 수 있어요.";
  }catch(e){
    t.className = "toast err";
    t.textContent = e && e.code==="declined" ? "저장을 취소했어요. 다시 누르면 저장할 수 있어요."
                  : e && e.code==="rate_limited" ? "저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요."
                  : "저장하지 못했어요. 결과 화면을 캡처해서 저장해 주세요.";
  }
}

function go(i){
  try{ speechSynthesis.cancel(); }catch(e){}
  state.idx = i;
  if(i===-2) renderCover(); else if(i<0) renderIntro(); else if(i>=CASES.length) renderResult(); else renderCase();
  renderProgress();
  window.scrollTo({top:0});
}
go(-2);
</script>
